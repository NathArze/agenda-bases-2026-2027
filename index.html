<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
<title>Agenda Bases 2026-2027</title>
<style>
:root{--rosa:#fc63a9;--rosa-d:#a81148;--line:#f0d6e3;--bg:#fff5fa;--ink:#3d1626;--sub:#8a5b74}
*{box-sizing:border-box;font-family:Nunito,Segoe UI,system-ui}
body{margin:0;background:linear-gradient(180deg,#f7f3ee,#ffe6f2);color:var(--ink)}
.wrap{max-width:520px;margin:0 auto;min-height:100dvh;background:#fff7fb;box-shadow:0 0 30px rgba(168,17,72,.15)}
#top{position:sticky;top:0;background:linear-gradient(135deg,var(--rosa),var(--rosa-d));color:#fff;padding:12px 16px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);display:flex;max-width:520px;margin:0 auto}
nav button{flex:1;border:0;background:none;padding:10px 6px;font-weight:800;color:var(--sub)}
nav button.on{color:var(--rosa-d)}
.sc{display:none;padding:16px 16px 90px}
.sc.on{display:block}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.base{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;text-align:left}
.base img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff}
.base .n{padding:8px 10px;font-weight:800}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px}
.fld input,.fld textarea,.fld select{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}
.btn{width:100%;border:0;border-radius:14px;padding:12px;font-weight:900;background:var(--rosa);color:#fff;box-shadow:0 4px 0 var(--rosa-d)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;background:#fff}
.day.busy{background:#ffe5ec;color:var(--rosa-d)}
.day.free{background:#f3fff9}
.day.sel{border-color:var(--rosa-d)}
.ev{border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:#fff}
.hidden{display:none}
</style>
</head>
<body>
<div class='wrap'>
<div id='top'><b>Agenda Bases</b></div>
<section class='sc on' id='sc-bases'>
  <h3>Bases</h3>
  <div class='bases' id='basesList'></div>
  <div id='calWrap' class='hidden'>
    <h3>Calendario</h3>
    <div id='calHead'></div>
    <div class='cal' id='calGrid'></div>
    <div id='calInfo' class='card'></div>
    <button class='btn' id='btnApartar'>Apartar / Solicitar pedido</button>
  </div>
</section>
<section class='sc' id='sc-agenda'>
  <h3>Agenda</h3>
  <div id='agendaList'></div>
</section>
<section class='sc' id='sc-send'>
  <h3>Enviar pedido / Apartado</h3>
  <div class='card'>
    <label class='fld'><span>Cliente</span><input id='sCli'></label>
    <label class='fld'><span>Teléfono</span><input id='sTel'></label>
    <label class='fld'><span>Fecha</span><input id='sFec' type='date'></label>
    <label class='fld'><span>Base</span><select id='sBas'><option value=''>Sin base</option></select></label>
    <label class='fld'><span>Hora</span><input id='sHor'></label>
    <label class='fld'><span>Pedido</span><textarea id='sPed'></textarea></label>
    <label class='fld'><span>Precio</span><input id='sPre'></label>
    <label class='fld'><span>Pago / Anticipo</span><input id='sPag'></label>
    <label class='fld'><span>Lugar / Entrega</span><textarea id='sLug'></textarea></label>
  </div>
  <button class='btn' id='btnEnviar'>Enviar solicitud</button>
  <p id='sMsg' class='hidden'></p>
</section>
<section class='sc' id='sc-admin'>
  <h3>Administrador</h3>
  <div id='admGate' class='card'>
    <label class='fld'><span>Contraseña</span><input id='admPass' type='password'></label>
    <button class='btn' id='admLogin'>Entrar</button>
  </div>
  <div id='admPanel' class='hidden'>
    <h4>Pendientes</h4>
    <div id='admList'></div>
  </div>
</section>
<nav>
  <button data-tab='sc-bases' class='on'>Bases</button>
  <button data-tab='sc-agenda'>Agenda</button>
  <button data-tab='sc-send'>Enviar</button>
  <button data-tab='sc-admin'>Admin</button>
</nav>
</div>
<script>
const ADMIN='sayurieslamejor';
const BASES=[
 {id:'b1',n:'Base 1',img:'1.png'},
 {id:'b2',n:'Base 2',img:'2.png'},
 {id:'b3',n:'Base 3',img:'3.png'},
 {id:'b4',n:'Base 4',img:'4.png'},
 {id:'b5',n:'Base 5',img:'5.png'},
 {id:'b6',n:'Base 6',img:'6.png'},
 {id:'b7',n:'Base 7',img:'7.png'},
 {id:'b8',n:'Base 8',img:'8.png'}
];
const EVENTS=[
 {id:1,d:'2026-07-12',tm:'',c:'Ma. Teresa',tel:'212-39-71-32',bs:[],bt:'No especificada',o:'30 personas Chocolate y oblea Dedicatoria: Felicidades Graduados',pr:'',ad:'Anticipo ',de:'Cortesía / Cotasia',st:'ok'},
 {id:2,d:'2026-08-22',tm:'5:00 PM',c:'Raymundo Ruiz',tel:'2222-56-14-66',bs:['b1'],bt:'Base',o:'100 personas Piñón blanco',pr:',450',ad:'-',de:'Cd. Serdán',st:'ok'}
];
let PEND=JSON.parse(localStorage.getItem('pend')||'[]');
let selBase=null,selDate=null;
function today(){const d=new Date();return d.toISOString().slice(0,10);}
function renderBases(){
  const list=document.getElementById('basesList');list.innerHTML='';
  BASES.forEach(b=>{
    const div=document.createElement('button');div.className='base';div.innerHTML='<img src=\"basesn/'+b.img+'\"><div class=\"n\">'+b.n+'</div>';
    div.onclick=()=>openCal(b);list.appendChild(div);
  });
  const sel=document.getElementById('sBas');sel.innerHTML='<option value=\"\">Sin base</option>'+BASES.map(b=>'<option value=\"'+b.id+'\">'+b.n+'</option>').join('');
}
function openCal(b){selBase=b;document.getElementById('calWrap').classList.remove('hidden');renderCal();}
function renderCal(){
  const grid=document.getElementById('calGrid');grid.innerHTML='';
  const now=new Date();const y=now.getFullYear(),m=now.getMonth();
  document.getElementById('calHead').innerHTML='<b>'+(now.toLocaleString('es-MX',{month:'long',year:'numeric'}))+'</b>';
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  for(let i=1;i<=last.getDate();i++){
    const d=y+'-'+String(m+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');
    const busy=EVENTS.some(e=>e.d===d && (e.bs.includes(selBase.id) || e.bt.toLowerCase().includes('base')));
    const btn=document.createElement('button');btn.className='day '+(busy?'busy':'free');btn.textContent=i;
    btn.onclick=()=>{selDate=d;document.getElementById('calInfo').innerHTML=busy?'<b>OCUPADA</b> para '+d:'<b>DISPONIBLE</b> para '+d;Array.from(grid.children).forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');};
    grid.appendChild(btn);
  }
}
function renderAgenda(){
  const list=document.getElementById('agendaList');list.innerHTML='';
  [...EVENTS].sort((a,b)=>(a.d>b.d?1:-1)).forEach(e=>{
    const b=e.bs.map(x=>BASES.find(bb=>bb.id===x)?.n||x).join(', ');
    const div=document.createElement('div');div.className='ev';
    div.innerHTML='<b>'+e.d+' '+(e.tm||'')+'</b><div>Cliente: '+e.c+' | Tel: '+e.tel+'</div><div>Base: '+(b||e.bt)+'</div><div>Pedido: '+e.o+'</div><div>Precio: '+e.pr+' | Pago: '+e.ad+'</div><div>Lugar: '+e.de+'</div>';
    list.appendChild(div);
  });
}
document.getElementById('btnApartar').onclick=()=>{
  if(!selDate){alert('Selecciona fecha');return;}
  document.getElementById('sFec').value=selDate;
  document.getElementById('sBas').value=selBase?selBase.id:'';
  go('sc-send');
};
document.getElementById('btnEnviar').onclick=()=>{
  const obj={id:Date.now(),d:document.getElementById('sFec').value,tm:document.getElementById('sHor').value,c:document.getElementById('sCli').value,tel:document.getElementById('sTel').value,bs:document.getElementById('sBas').value?[document.getElementById('sBas').value]:[],bt:document.getElementById('sBas').value?(BASES.find(b=>b.id===document.getElementById('sBas').value)?.n||''):'Sin base',o:document.getElementById('sPed').value,pr:document.getElementById('sPre').value,ad:document.getElementById('sPag').value,de:document.getElementById('sLug').value,st:'pend'};
  if(!obj.c||!obj.d){alert('Falta cliente o fecha');return;}
  PEND.push(obj);localStorage.setItem('pend',JSON.stringify(PEND));document.getElementById('sMsg').textContent='Solicitud enviada. Espera aprobación del administrador.';document.getElementById('sMsg').classList.remove('hidden');renderAdmin();
};
document.getElementById('admLogin').onclick=()=>{
  if(document.getElementById('admPass').value===ADMIN){document.getElementById('admGate').classList.add('hidden');document.getElementById('admPanel').classList.remove('hidden');renderAdmin();}else alert('Contraseña incorrecta');
};
function renderAdmin(){
  const list=document.getElementById('admList');list.innerHTML='';
  PEND.filter(p=>p.st==='pend').forEach(p=>{
    const div=document.createElement('div');div.className='ev';
    div.innerHTML='<b>'+p.d+' '+(p.tm||'')+'</b><div>Cliente: '+p.c+' | Tel: '+p.tel+'</div><div>Pedido: '+p.o+'</div><div>Precio: '+p.pr+' | Pago: '+p.ad+'</div><div>Lugar: '+p.de+'</div><div><button id=\"ap'+p.id+'\">Aprobar</button> <button id=\"re'+p.id+'\">Rechazar</button></div>';
    list.appendChild(div);
    document.getElementById('ap'+p.id).onclick=()=>{p.st='ok';EVENTS.push({...p,st:'ok'});PEND=PEND.map(x=>x.id===p.id?{...x,st:'ok'}:x);localStorage.setItem('pend',JSON.stringify(PEND));renderAgenda();renderAdmin();alert('Aprobado y agregado a agenda');go('sc-agenda');};
    document.getElementById('re'+p.id).onclick=()=>{PEND=PEND.map(x=>x.id===p.id?{...x,st:'no'}:x);localStorage.setItem('pend',JSON.stringify(PEND));renderAdmin();};
  });
}
function go(id){document.querySelectorAll('.sc').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===id));}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
renderBases();renderAgenda();renderAdmin();
</script>
</body>
</html>
